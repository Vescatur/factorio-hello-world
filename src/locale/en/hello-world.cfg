[entity-description]
entrance=Customers arrive here. Only one Entrance can exist in the factory.
lab=Turns money into progress. Research is priced in currency, so every technology is an invoice.
loader=Loads and unloads a machine continuously, in a single tile. Takes no power, like everything else here.
fast-loader=Loads and unloads a machine continuously, in a single tile, at the speed of a fast belt.
express-loader=Loads and unloads a machine continuously, in a single tile, at the speed of an express belt.
loader-1x2-stub=Not obtainable. A leftover the engine insists on.

[item-description]
entrance=Customers arrive here. Only one Entrance can exist in the factory.
customer_ghost=A customer who was never served. Ghosts never spoil and nothing will take them.
customer_diamond=A client who wants a rocket launched. Build a satellite around them and send it up: the launch pays in diamonds. Spoils back down to a productivity module 3 order.
customer_angry-burner-inserter=An order that ran out of patience. Nothing will take it any more: it spoils into a ghost.
customer_burner-inserter=An order for burner inserters, paid in pennies. Spoils into an angry customer if it is not served in time.
customer_assembling-machine-1=An order for basic assembling machines, paid in pennies. Spoils down to a burner inserter order.
customer_transport-belt=An order for transport belts, paid in pennies, with a silver coin on top. Spoils down to an assembling machine 1 order.
customer_inserter=An order for inserters, paid in silver. Requires The Silver Coin. Spoils down to a transport belt order.
customer_splitter=An order for splitters, paid in silver. Requires The Silver Coin. Spoils down to an inserter order.
customer_assembling-machine-2=An order for assembling machines, paid in silver, with a banknote on top. Requires The Silver Coin. Spoils down to a splitter order.
customer_bulk-inserter=An order for bulk inserters, paid in banknotes. Requires The Banknote. Spoils down to an assembling machine 2 order.
customer_electric-furnace=An order for electric furnaces, paid in banknotes. Requires The Banknote. Spoils down to a bulk inserter order.
customer_productivity-module=An order for productivity modules, paid in banknotes, with a bond on top. Requires The Banknote. Spoils down to an electric furnace order.
customer_construction-robot=An order for construction robots, paid in bonds. Requires The Bond. Spoils down to a productivity module order.
customer_logistic-robot=An order for logistic robots, paid in bonds. Requires The Bond. Spoils down to a construction robot order.
customer_roboport=An order for roboports, paid in bonds, with a gold bar on top. Requires The Bond. Spoils down to a logistic robot order.
customer_express-transport-belt=An order for express transport belts, paid in gold. Requires The Gold Bar. Spoils down to a roboport order.
customer_beacon=An order for beacons, paid in gold. Requires The Gold Bar. Spoils down to an express transport belt order.
customer_productivity-module-3=An order for productivity modules, paid in gold. Requires The Gold Bar. Spoils down to a beacon order. Serving one may bring in a client who wants a rocket launched.
lab=Turns money into progress. Research is priced in currency, so every technology is an invoice.
automation-science-pack=Loose change. The base denomination: customers pay in pennies and every purchase is settled in them.
logistic-science-pack=Struck silver. Worth a stack of pennies, and the price of anything past the first few technologies.
chemical-science-pack=Paper money. Worth far more than the metal it is printed on, and only earned from serious orders.
production-science-pack=A sealed certificate of debt. Industrial money, backed by the factory itself.
utility-science-pack=A cast ingot of gold. Reserve currency, not pocket money.
space-science-pack=Compressed wealth. The largest denomination there is.

