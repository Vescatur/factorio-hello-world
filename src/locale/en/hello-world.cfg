customer-new=A customer walks in.
buy_wood=Buy wood with pennies.
buy_iron-ore=Buy iron ore with pennies. Smelt it into plates yourself.
buy_copper-ore=Buy copper ore with pennies. Smelt it into plates yourself.
buy_coal=Buy coal with pennies. Nothing burns it — it is chemistry, not fuel.
buy_stone=Buy stone with pennies.
buy_crude-oil-barrel=Buy a barrel of crude oil with pennies. Empty it to keep the barrel.

