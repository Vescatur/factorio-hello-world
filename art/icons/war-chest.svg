<?xml version="1.0" encoding="UTF-8"?>
<!--
  War Chest — military-tier currency (re-skins military-science-pack).

  An iron-banded strongbox. It keeps the grey of the vanilla military pack so
  the tech tree still reads at a glance, with a gold lock as the only warm
  accent — money under guard rather than money in circulation.

  Palette:  lid #545C66  body #3E454D  band #98A2AD  lock #D8A72A  outline #171A1E

  Rendered by tools/svg-to-png.py at 64x64.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <g stroke="#171A1E" stroke-width="3" stroke-linejoin="round">
    <!-- Arched lid, drawn first so the body's top edge cuts it off cleanly. -->
    <path fill="#545C66" d="M 9 30 C 9 14 55 14 55 30 Z" />
    <!-- Body. -->
    <path fill="#3E454D" d="M 9 30 L 55 30 L 55 51 L 9 51 Z" />
  </g>

  <!-- Iron bands: two side straps and the central one carrying the lock. -->
  <g fill="#98A2AD" stroke="#171A1E" stroke-width="2.5" stroke-linejoin="round">
    <path d="M 15 21.5 C 15 18 21 16.5 21 16.5 L 21 51 L 15 51 Z" />
    <path d="M 49 21.5 C 49 18 43 16.5 43 16.5 L 43 51 L 49 51 Z" />
    <path d="M 28.5 15.5 L 35.5 15.5 L 35.5 51 L 28.5 51 Z" />
  </g>

  <!-- Lock plate. -->
  <rect fill="#D8A72A" stroke="#171A1E" stroke-width="2.5" x="26" y="31" width="12" height="11" rx="2" />
  <rect fill="#171A1E" x="31" y="34" width="2" height="5" rx="1" />

  <!-- Lid highlight, upper-left, matching the light direction of the other icons. -->
  <path fill="#6E7885" d="M 12 27 C 12.5 18 22 15.5 26 15.5 C 20 18 15.5 22 15 27 Z" />
</svg>
