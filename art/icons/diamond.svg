  <path fill="#E4F7FD" d="M 23 21 L 41 21 L 47 29 L 17 29 Z" />
  <path fill="#6EC6E0" d="M 17 29 L 32 29 L 32 54 Z" />
  <path fill="#4AA6C6" d="M 32 29 L 47 29 L 32 54 Z" />

  <!-- Crown facet lines. -->
  <g stroke="#9FE3F5" stroke-width="2" stroke-linecap="round">
    <path d="M 23 21 L 20 29" />
    <path d="M 41 21 L 44 29" />
  </g>

  <!-- Silhouette and girdle. -->
  <g fill="none" stroke="#10323F" stroke-width="3" stroke-linejoin="round">
    <path d="M 23 21 L 41 21 L 47 29 L 32 54 L 17 29 Z" />
    <path d="M 17 29 L 47 29" />
  </g>

  <!-- Sparkle on the table, upper-left, as on the coins. -->
  <path fill="#FFFFFF" d="M 25.5 22.5 L 33 22.5 L 30 27 L 22.5 27 Z" />
</svg>
