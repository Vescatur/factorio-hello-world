<!--
  Diamond — top-tier currency (re-skins space-science-pack).

  A brilliant cut, point down. White-cyan, matching the vanilla space pack, and
  the only icon with a pointed base — it should read as the odd one out, since
  it is the tier the factory can barely reach.

  Palette:  table #E4F7FD  crown #9FE3F5  pavilion-left #6EC6E0  pavilion-right #4AA6C6
            outline #10323F

  Rendered by tools/svg-to-png.py at 64x64.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
