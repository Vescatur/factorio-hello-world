<?xml version="1.0" encoding="UTF-8"?>
<!--
  Customer token base icon. Reconstructed from the original src/graphics/icons/
  customer.png after its source was lost, so the geometry below is measured off
  that file: opaque bounds x 15-48 / y 4-59, head widest at y 16 (x 20-43),
  shoulders meeting the body in a dark band at y 24, flat base at y 59.

  The head is drawn first and the body over it, which is how the original hides
  the head's lower arc instead of showing a seam across the shoulders.

  Palette taken from the same decode:
    fill #F0A63C   outline #2B1A0D   highlight #F2B673   shade #946526

  Rendered by tools/svg-to-png.py at 64x64.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <g stroke="#2B1A0D" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- Head: outer extent x 20-44, y 4-28, the lower third covered by the body. -->
    <circle fill="#F0A63C" cx="32" cy="16" r="10.5" />
    <!-- Body: narrow at the shoulders, flaring to a flat base. -->
    <path fill="#F0A63C" d="M 16.5 58.5
                            L 19.5 30
                            C 20 26.5 22.5 24.5 26 24.5
                            L 38 24.5
                            C 41.5 24.5 44 26.5 44.5 30
                            L 47.5 58.5
                            Z" />
  </g>
  <!-- Highlights sit inside the outline, upper-left, as in the original. -->
  <g fill="#F2B673">
    <ellipse cx="27" cy="11.5" rx="3.6" ry="2.8" />
    <path d="M 22.5 33 L 24.5 29.5 C 25.5 28 27.5 27.5 28.5 28.5 L 25.5 55 L 20.5 55 Z" />
  </g>
  <!-- Shade along the base, where the body turns away from the light. -->
  <path fill="#946526" d="M 42 40 L 45.8 55.5 L 40.5 55.5 Z" />
</svg>
