<?xml version="1.0" encoding="UTF-8"?>
<!--
  What a customer leaves behind when nobody serves them: customer_ghost.

  Deliberately a sibling of customer.svg: same 64x64 frame, same footprint
  (x 15-48 / y 4-59), same #2B1A0D outline at stroke-width 3, so the two read as
  the same family in an item list. Only the silhouette (dome head, wavy hem) and
  the pale spectral fill say "this one is gone".

  Rendered by tools/svg-to-png.py at 64x64.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <path fill="#DCE6EC" stroke="#2B1A0D" stroke-width="3" stroke-linejoin="round"
        d="M 32 5.5
           C 42.6 5.5 47.5 15 47.5 27.5
           L 47.5 50
           C 47.5 55.5 46.5 58.5 44 58.5
           C 41.5 58.5 40 53.5 37.5 53.5
           C 35 53.5 34 58.5 31.5 58.5
           C 29 58.5 27.5 53.5 25 53.5
           C 22.5 53.5 21 58.5 18.5 58.5
           C 16.5 58.5 16.5 55 16.5 50
           L 16.5 27.5
           C 16.5 15 21.4 5.5 32 5.5
           Z" />
  <!-- Hollow eyes, set at the same height as a customer's face. -->
  <g fill="#2B1A0D">
    <ellipse cx="26.5" cy="24" rx="2.8" ry="3.6" />
    <ellipse cx="37.5" cy="24" rx="2.8" ry="3.6" />
  </g>
  <!-- A faint sheen, mirroring the highlight on customer.svg. -->
  <path fill="#F2F8FB" d="M 21.5 30 C 21.5 18 24 12 28 10 C 24.5 14.5 24.5 22 24.5 30 Z" />
</svg>
